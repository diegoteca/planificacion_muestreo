project:
  type: book
  output-dir: "_book"
  execute-dir: project

resources:
  simulador_teorema_limite_central.html

book:
  title: "Taller Muestreo"
  author:
    - name: "Recursos Didácticos y Tecnológicos para la Enseñanza"
      email: ""
      affiliations:
        - id: "PBA"
        - name: "Subsecretaria de Planeamiento Educativo - PBA"
        - id: "UNAJ"
        - name: ""
  date: today
  date-format: long
  downloads: [pdf] 
#  date: ""
  chapters:
    - index.qmd
    - muestras.qmd
    - azar.qmd
    - cubo.qmd
    - calibracion.qmd
    - muestra_2025.qmd
    - references.qmd
    
page-navigation: true

search: true

bibliography: references.bib
# Esto depende de la extension "section-biblioraphie"
# reference-section-title: Referencias de este capítulo
#citeproc: false
#csl: apa.csl

preview:
  port: 4200
  browser: true

format:
  html:
    number-sections: true
    crossref:
      chapters: true
    toc: true
    theme: cosmo
    fig-cap-location: top
    other-links:
      - text: Repositorio del taller
        href: https://github.com/diegoteca/planificacion_muestreo
        icon: github
    code-fold: true
    code-tools:
       source: true
       toggle: true
       caption: "Código"
    css: css_book.css
    first-line-indent:
      size: 0.5em

  pdf:
    pdfengine: xelatex
    documentclass: scrreprt
    abstract: "Versión 1.0.1"
    template-partials:
      - before-body.tex
      - toc.tex
    papersize: a4
    indent: true
    fig-cap-location: top
    fig-dpi: 300
    number-sections: true

editor: visual
lang: es
language:
  search-text-placeholder: Buscar
  
execute: 
  echo: false
  warning: false
  message: false
  freeze: auto
# cache: true
# Extensiones

filters:
  - first-line-indent
