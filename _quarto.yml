project:
  type: book
  output-dir: "_book"
  execute-dir: project
  resources:
    -simulador_teorema_limite_central.html

execute:
  echo: false
  warning: false # Esto se puede cambiar en aquellos casos en donde sea importante ver el código. p.e. calculo.qmd
  freeze: auto # Usar "true" never re-render during project render. 
  #Si está en auto es buena opción renderizar por documentos individuales para ver cambios rapidos 
  #pero no es tan buena para el desarrollo porque no se renderizan los cambios en los documentos relacionados. 
  #Por ejemplo, si se cambia algo en metodología.qmd, no se van a ver los cambios en calculo.qmd. 
  # Con auto se renderizan los documentos que cambiaron y los relacionados.
  cache: true

number-depth: 3  
toc-depth: 3

book:
  title: "Taller Muestreo"
  author:
    - name: "Recursos Didácticos y Tecnológicos para la Enseñanza"
      email: ""
      affiliations:
        - id: "PBA"
        - name: "Subsecretaria de Planeamiento Educativo - PBA"
        - id: "UNAJ"
        - name: ""
  date: today
  date-format: long
  downloads: [pdf] 
#  date: ""
  chapters:
    - index.qmd
    - part: "Diseños muestrales"
      chapters:
        - muestras.qmd
        - azar.qmd
        - cubo.qmd
        - calibracion.qmd
    - part: "Aplicaciones prácticas"
      chapters:
         - muestra_peb_2025.qmd
         - muestra_adultos.qmd
  appendices:
         - references.qmd
    
page-navigation: true
search: true

bibliography: references.bib
# Esto depende de la extension "section-biblioraphie"
# reference-section-title: Referencias de este capítulo
citeproc: true # Si se quiere que typst use el suyo, conviene false. Sino true
csl: apa7.csl

crossref:
  chapters: true #No se bien que hace
  appendix-title: "Anexo"
  appendix-delim: ":"
  lof-title: "Índice de figuras"
  lot-title: "Índice de tablas"

preview:
  port: 4200
  browser: true

indent: true 
first-line-indent:
      size: 0.5em
      remove-after:
        - BlockQuote
       # - BulletList
        - CodeBlock
       # - DefinitionList
        - HorizontalRule
       # - OrderedList

format:
  html:
    toc: true
    toc-depth: 3
    toc-title: "Índice de secciones"
    fig-cap-location: top
    number-sections: true
    theme: cosmo
    other-links:
      - text: Repositorio del taller
        href: https://github.com/diegoteca/planificacion_muestreo
        icon: github
    code-fold: true
    code-tools:
       source: true
       toggle: true
       caption: "Código"
    css: css_book.css # Hay que ver que cambia y como impacta en typst. En typst se puede usar css pero no es tan directo como en html. Hay que bajar la extensión "typst-partials" y editar los archivos .typ a mano.
    callout-appearance: minimal
    callout-icon: false
    
# Pruebo con typst porque ahora ya funciona con quarto book
# La opción por defecto es orange-book. Si se baja la extensión se puede editar esos "partials" a mano.
