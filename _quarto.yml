editor: visual
lang: es
language:
  search-text-placeholder: "Buscar"
  section-title-appendices: "Anexos"
  section-title-references: "Referencias"
  section-title-copyright: "Licencia"
  list-of-figure-title: "Lista de Figuras"
  list-of-table-title: "Lista de Tablas"
  crossref-nte-prefix: "Nota de color"
  crossref-tip-prefix: "Tip"
  crossref-wrn-prefix: "Atención"
  crossref-imp-prefix: "Importante"
  crossref-cau-prefix: "Peligro"
  crossref-ch-prefix: "Cap."
  crossref-sec-prefix: "Sec."
  crossref-app-prefix: "Anexo"
  crossref-ch-title: "Capítulos"
  crossref-app-title: "Anexo" # Sin "s"
  callout-nte-title: "Nota de color"
  crossref-nte-title: "Nota de color"
  
# Extensiones

filters:
  - first-line-indent
